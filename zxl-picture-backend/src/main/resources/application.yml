server:
  port: 8123
  servlet:
    context-path: /api
  # cookie 设置30天过期
    session:
      cookie:
        max-age: 2592000

spring:
  application:
    name: zxl-picture-backend
  # 空间图片分表
  shardingsphere:
    datasource:
      names: zxl_picture
      zxl_picture:
        type: com.zaxxer.hikari.HikariDataSource
        driver-class-name: com.mysql.cj.jdbc.Driver
        url: jdbc:mysql://localhost:3306/zxl_picture
        username: root
        password: zxl123
    rules:
      sharding:
        tables:
          picture:
            actual-data-nodes: zxl_picture.picture  # 动态分表
            table-strategy:
              standard:
                sharding-column: spaceId
                sharding-algorithm-name: picture_sharding_algorithm  # 使用自定义分片算法
        sharding-algorithms:
          picture_sharding_algorithm:
            type: CLASS_BASED
            props:
              strategy: standard
              algorithmClassName: com.zxl.zxlpicturebackend.manager.sharding.PictureShardingAlgorithm
    props:
      sql-show: true

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/zxl_picture
    username: root
    password: zxl123

  profiles:
    active: local
   # session 配置
  session:
    store-type: redis
      # session 30天过期
    timeout: 2592000
  # redis 配置
  redis:
    database: 0
    host: 127.0.0.1
    port: 6379
    connect-timeout: 5000
  # 设置更大的文件上传体积
  servlet:
    multipart:
      max-file-size: 10MB

mybatis-plus:
  configuration:
    # MyBatis 配置
    map-underscore-to-camel-case: false
    # 在控制台打印日志
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    enable-sql-runner: true
#    # 逻辑删除
#  global-config:
#    db-config:
#      logic-delete-field: isdeleted # 全局逻辑删除字段名
#      logic-delete-value: 1 # 逻辑已删除值
#      logic-not-delete-value: 0 # 逻辑未删除值

# 接口文档
knife4j:
  enable: true
  openapi:
    title: 接口文档
    version: 1.0
    group:
      default:
#        group-name: 分组名称
        api-rule: package
        api-rule-resources:
          - com.zxl.zxlpicturebackend.controller
